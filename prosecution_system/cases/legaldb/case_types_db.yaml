    法条: 刑法第133条之一（刑法修正案八增设）
    定义: 在道路上驾驶机动车追逐竞驶，情节恶劣的，或者在道路上醉酒驾驶机动车的
    法定刑: 拘役，并处罚金
    注: 同时构成其他犯罪的，依照处罚较重的规定定罪处罚
