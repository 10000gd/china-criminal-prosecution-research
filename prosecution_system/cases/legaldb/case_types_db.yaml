  - 抢劫罪:
    法条: 刑法第263条
    定义: 以暴力、胁迫或者其他方法抢劫公私财物的
    基本刑: 三年以上十年以下有期徒刑，并处罚金
    加重情节: 入户抢劫；在公共交通工具上抢劫；抢劫银行或其他金融机构；多次抢劫；抢劫致人重伤或死亡；冒充军警人员抢劫；持枪抢劫；抢劫军用物资或抢险救灾物资
    加重刑: 十年以上有期徒刑、无期徒刑或者死刑，并处罚金或者没收财产
  - 有价证券诈骗罪:
