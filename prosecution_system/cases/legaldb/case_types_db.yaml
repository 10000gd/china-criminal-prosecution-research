  - 对非国家工作人员行贿罪:
    法条: 刑法第389条（刑法修正案十二修订）
    定义: 为谋取不正当利益，给予国家工作人员以财物的
    基本刑: 五年以下有期徒刑或者拘役，并处罚金
    情节严重: 五年以上十年以下有期徒刑，并处罚金
    特别严重: 十年以上有期徒刑或者无期徒刑，并处罚金或者没收财产
    注: 因被勒索给予财物未获不正当利益的，不算行贿
  - 扰乱国家机关工作秩序罪
  - 故意泄露国家秘密罪
  - 煽动分裂国家罪
  - 煽动颠覆国家政权罪
  - 盗窃、抢夺、毁灭国家机关公文、证件、印章罪
  - 聚众冲击国家机关罪
  - 背叛国家罪
  - 资助危害国家安全犯罪活动罪
  - 走私国家禁止进出口的货物、物品罪
  - 过失泄露国家秘密罪
  - 非国家工作人员受贿罪:
    法条: 刑法第385条
    定义: 国家工作人员利用职务上的便利，索取他人财物的，或者非法收受他人财物，为他人谋取利益的
    基本刑: 三年以下有期徒刑或者拘役，并处罚金
    数额巨大: 三年以上十年以下有期徒刑，并处罚金
    数额特别巨大: 十年以上有期徒刑或者无期徒刑，并处没收财产
    注: 索贿从重处罚
  - 非法持有国家绝密、机密文件、资料、物品罪
  - 非法获取国家秘密罪

危害公共安全罪  (21个):
  - 不报、谎报安全事故罪
  - 交通肇事罪:
    法条: 刑法第133条
    定义: 违反交通运输管理法规，因而发生重大事故，致人重伤、死亡或者使公私财产遭受重大损失的
    基本刑: 三年以下有期徒刑或者拘役
    逃逸/恶劣情节: 三年以上七年以下有期徒刑
    逃逸致人死亡: 七年以上有期徒刑
  - 以危险方法危害公共安全罪
