侵犯财产罪  (17个):
  - 保险诈骗罪:
    法条: 刑法第266条
    定义: 诈骗公私财物，数额较大的
    基本刑: 三年以下有期徒刑、拘役或者管制，并处或者单处罚金
    数额巨大: 三年以上十年以下有期徒刑，并处罚金
    数额特别巨大: 十年以上有期徒刑或者无期徒刑，并处罚金或者没收财产
    入罪标准: 数额较大（3000-10000元+，各省不一）
