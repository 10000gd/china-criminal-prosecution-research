  gap_type: bribery_amount_unclear
  description: 单位行贿罪行贿金额不明确，受贿方处理情况不明
  severity: medium
  recommended_evidence:
  - 行受贿资金流水
  - 官员处理情况公示
  - 恒大内部行贿审批记录
