charges:
  charges_judged:
    crime_176:
      name: 非法吸收公众存款罪
      statute: 刑法第176条
      charge_weight: primary
      evidence_type:
      - bank_records
      - contracts
      - investor_testimony
      - regulatory_filings
    crime_192:
      name: 集资诈骗罪
      statute: 刑法第192条
      charge_weight: primary
      evidence_type:
      - bank_records
      - contracts
      - financial_statements
      - fraud_indicators
    crime_186:
      name: 违法发放贷款罪
      statute: 刑法第186条
      charge_weight: supporting
      evidence_type:
      - loan_approval_docs
      - bank_records
      - regulatory_inspection
    crime_160:
      name: 欺诈发行证券罪
      statute: 刑法第160条
      charge_weight: primary
      evidence_type:
      - prospectus
      - financial_statements
      - underwriting_contracts
      - false_filing
    crime_161:
      name: 违规披露重要信息罪
      statute: 刑法第161条
      charge_weight: supporting
      evidence_type:
      - annual_reports
      - regulatory_filings
      - board_meeting_records
    crime_393:
      name: 单位行贿罪
      statute: 刑法第393条
      charge_weight: supporting
      evidence_type:
      - bribe_contracts
      - payment_records
      - beneficiary_confirm
    crime_185_1:
      name: 违法运用资金罪
      statute: 刑法第185条之一
      charge_weight: supporting
      evidence_type:
      - insurance_fund_records
      - regulatory_reports
      - fund_flow
    crime_271:
      name: 职务侵占罪
      statute: 刑法第271条
      charge_weight: supporting
      evidence_type:
      - dividend_records
      - board_resolutions
      - transfer_documents
  charges_missed:
    crime_176_supplement:
      name: 非法吸收公众存款罪（加重情节：数额特别巨大+严重情节）
      statute: 刑法第176条 + 司法解释
      reason: 涉案金额超万亿，属数额特别巨大+严重情节，应升档量刑
    crime_159:
      name: 欺诈发行债券罪
      statute: 刑法第159条
      reason: 恒大发行大量企业债/公司债，涉及欺诈发行债券
    crime_175:
      name: 骗取贷款、票据承兑、金融票证罪
      statute: 刑法第175条
      reason: 通过虚假材料骗取银行信贷资金
    crime_176_supplement_2:
      name: 非法吸收公众存款罪（单位犯罪直接责任人追责）
      statute: 刑法第176条
      reason: 对其他直接责任人应单独追究
    crime_185:
      name: 挪用资金罪
      statute: 刑法第185条
      reason: 挪用保险资金归恒大使用
    crime_224:
      name: 合同诈骗罪
      statute: 刑法第224条
      reason: 购房合同诈骗、理财产品合同诈骗
    crime_224_1:
      name: 组织领导传销活动罪
      statute: 刑法第224条之一
      reason: 恒大财富非法集资具有传销特征
    crime_225:
      name: 非法经营罪
      statute: 刑法第225条
      reason: 无金融资质从事金融业务
    crime_266:
      name: 诈骗罪
      statute: 刑法第266条
      reason: 对特定受害者的诈骗行为
    crime_382_385:
      name: 贪污罪/受贿罪（国家工作人员）
      statute: 刑法第382条、第385条
      reason: 金融机构中国家工作人员收受贿赂
    crime_396:
      name: 私分国有资产罪
      statute: 刑法第396条
      reason: 以分红名义私分国有资产
    crime_224_2:
      name: 集资诈骗罪（加重情节）
      statute: 刑法第192条 + 司法解释
      reason: 数额特别巨大+特别严重情节，升档量刑
evidence_gaps:
- gap_id: EG-001
  crime: crime_192
  gap_type: fraud_intent_missing
  description: 集资诈骗罪核心要件'非法占有目的'证据链断裂
  severity: critical
  recommended_evidence:
  - 资金流向全记录
  - 隐匿资产清单
  - 境外账户流水
  - 实际控制人指令记录
- gap_id: EG-002
  crime: crime_186
  gap_type: procedure_violation_unproven
  description: 违法发放贷款罪'违反国家规定'程序违规未经证实
  severity: high
  recommended_evidence:
  - 贷款审批流程文件
  - 内部合规审查记录
  - 监管现场检查笔录
- gap_id: EG-003
