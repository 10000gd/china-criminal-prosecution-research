policy_recommendations:
- area: 立法完善
  recommendations:
  - 完善上市公司财务造假刑事追诉标准
  - 建立集团犯罪跨法域追诉机制
  - 强化中介机构刑事责任
  - 完善投资者保护基金制度
- area: 司法实践
  recommendations:
  - 统一非法集资数额认定标准
  - 明确'非法占有目的'司法推定规则
  - 建立受害投资者优先受偿机制
- area: 监管改革
  recommendations:
  - 建立房地产企业杠杆率动态监测
  - 完善关联交易信息披露制度
  - 强化境外上市企业境内监管
