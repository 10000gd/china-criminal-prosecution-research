# ============================================================
# 案件配置模板 - 复制此文件，填写案件参数
# ============================================================
# 使用方法：
#   1. 复制此文件，重命名为 <your_case>.yaml
#   2. 填写所有必填字段（标记 TODO 的部分）
#   3. 运行 python src/build_report.py --case CASE-XXX
# ============================================================

meta:
  case_id: "CASE-002"                    # TODO: 全局唯一编号（格式：CASE-XXX）
  case_name: ""                          # TODO: 简称
  case_name_full: ""                     # TODO: 全称
  case_type: "financial_crime"           # TODO: financial_crime | corruption | environmental | mixed | other
  status: "investigating"               # investigating | prosecuted | judged | appealed | closed
  confidentiality: "public"              # public | internal | classified
  report_date: ""                        # TODO: 报告生成日期（YYYY-MM-DD）
  report_lang: "zh"

# 基本信息
case_info:
  case_number: ""                        # TODO: 案号
  court: ""                              # TODO: 审理法院
  court_level: ""                        # TODO: 基层 | 中级 | 高级 | 最高
  trial_level: "first"                   # first | appellate | retrial | supreme
  judgment_date: ""                      # TODO: 判决日期（YYYY-MM-DD，未判决则留空）
  source_url: ""                         # TODO: 官方信息来源URL
  source_media: ""                        # TODO: 来源媒体名称
  source_media_url: ""                   # TODO: 来源媒体URL

# 被告单位
defendants_corp:
  - name: ""                             # TODO: 完整名称
    alias: ""                            # TODO: 常用简称
    role: ""                             # TODO: 主犯单位 | 从犯单位
    status: "unit_defendant"
    charges: []                          # TODO: 罪名ID列表，如 [crime_176, crime_192]
    verdict_fine: null                   # TODO: 罚金（元），未判决则 null
    assets_frozen: false

# 被告自然人
defendants_person:
  - name: ""                             # TODO: 姓名
    role: ""                             # TODO: 职务/角色
    status: "person_defendant"
    charges: []                          # TODO: 罪名ID列表
    verdict_punishment: null             # TODO: 判决结果，未判决则 null
    deprivation_of_politics: null
    confiscation_of_property: null
    prison_term: null                    # TODO: 有期徒刑年数
    prison_years_min: null               # TODO: 有期徒刑下限
    prison_years_max: null               # TODO: 有期徒刑上限

# 罪名配置（定义所有罪名）
charges:
  charges_judged: {}                    # {crime_id: {name, statute, charge_weight, evidence_type}}
  charges_missed: {}                    # {crime_id: {name, statute, reason}}

# 证据链断裂点
evidence_gaps: []

# 受害者
victims: []

# 类案研究
comparable_cases:
  domestic: []
  international: []

# 资产
assets:
  total_debt_approx: null
  assets_frozen: false
  main_assets: []

# 政策建议
policy_recommendations: []

# 数据来源
sources: []
