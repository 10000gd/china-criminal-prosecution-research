# Docker Compose - 中国刑事追诉智能辅助系统
# 
# 使用方法:
#   开发模式: docker-compose up
#   生产模式: docker-compose -f docker-compose.prod.yml up -d
#   停止:     docker-compose down

version: '3.8'

services:
  # 主应用
  prosecution-system:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prosecution-system
    ports:
      - "5000:5000"
    volumes:
      # 持久化数据
      - ./data:/app/data
      - ./output:/app/output
      - ./logs:/app/logs
      # 挂载本地cases目录（方便修改案件数据）
      - ./cases:/app/cases
    environment:
      - FLASK_ENV=production
      - PORT=5000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - prosecution-net

  # 可选: Nginx反向代理
  # nginx:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #   depends_on:
  #     - prosecution-system
  #   networks:
  #     - prosecution-net

networks:
  prosecution-net:
    driver: bridge
