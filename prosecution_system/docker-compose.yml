# ============================================================
# Docker Compose - 检察机关办案系统
# ============================================================
# 用法:
#   docker compose up -d        # 启动所有服务
#   docker compose down         # 停止所有服务
#   docker compose logs -f web  # 查看 Web 日志
#   docker compose exec web cli health  # 在容器中运行 CLI
# ============================================================

services:
    # ── Web 主服务 ──────────────────────────────────────────
    web:
        build: .
        container_name: prosecution-web
        restart: unless-stopped
        environment:
            - FLASK_ENV=production
            - SECRET_KEY=${SECRET_KEY:-change-this-in-production}
            - DATABASE_URL=sqlite:///data/prosecution.db
            - PORT=5000
            - HF_HUB_DOWNLOAD_TIMEOUT=10
            - HF_HUB_HTTP_TIMEOUT=10
        ports:
            - "${PORT:-5000}:5000"
        volumes:
            - ./cases:/app/cases:ro
            - prosecution_data:/app/data
            - prosecution_backups:/app/backups
            - prosecution_output:/app/output
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:5000/health/live"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s
        networks:
            - prosecution-net

    # ── Nginx 反向代理 ──────────────────────────────────────
    nginx:
        image: nginx:alpine
        container_name: prosecution-nginx
        restart: unless-stopped
        ports:
            - "${NGINX_HTTP_PORT:-80}:80"
            - "${NGINX_HTTPS_PORT:-443}:443"
        volumes:
            - ./nginx.conf:/etc/nginx/nginx.conf:ro
        depends_on:
            web:
                condition: service_healthy
        networks:
            - prosecution-net

    # ── Redis 缓存（可选）────────────────────────────────────
    # redis:
    #     image: redis:alpine
    #     container_name: prosecution-redis
    #     restart: unless-stopped
    #     ports:
    #         - "6379:6379"
    #     volumes:
    #         - prosecution_redis:/data
    #     networks:
    #         - prosecution-net

# ── 命名卷 ────────────────────────────────────────────────
volumes:
    prosecution_data:
    prosecution_backups:
    prosecution_output:
    # prosecution_redis:

# ── 网络 ──────────────────────────────────────────────────
networks:
    prosecution-net:
        name: prosecution-network
