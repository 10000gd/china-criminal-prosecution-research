name: Build PDF Report

on:
  workflow_dispatch:

jobs:
  build-latex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LaTeX + Chinese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-xetex \
            texlive-lang-chinese \
            texlive-latex-extra \
            fonts-noto-cjk
          sudo fc-cache -f -v

      - name: Build PDF
        run: |
          cd hengda_final_report
          python3 build_report.py || true
          xelatex -interaction=nonstopmode hengda_full_report.tex || true
          xelatex -interaction=nonstopmode hengda_full_report.tex || true
          xelatex -interaction=nonstopmode hengda_full_report.tex || true

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: hengda-report-pdf
          path: hengda_final_report/hengda_full_report.pdf
